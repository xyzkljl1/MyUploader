[package]
name = "bili-uploader"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
biliup = { git = "https://github.com/biliup/biliup.git", tag = "v1.2.2" }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
